name: Auto-update Library Modules

on:
  schedule:
    # Runs every 3 days at 12:00 UTC
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-modules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "py2rs-bot"
          git config user.email "bot@py2rs.dev"

      - name: Get current module count
        id: count
        run: |
          MODULE_COUNT=$(grep -c 'lib!(' py2rs/src-tauri/src/crate_map.rs || echo "0")
          echo "current_count=$MODULE_COUNT" >> $GITHUB_OUTPUT
          echo "Current module count: $MODULE_COUNT"

      - name: Check if we should add a module
        id: check
        run: |
          # Check if last commit was auto-update (skip if yes to avoid double-commits)
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$LAST_COMMIT_MSG" == *"chore: auto-add library mapping"* ]]; then
            echo "should_update=false" >> $GITHUB_OUTPUT
            echo "Last commit was auto-update, skipping"
          else
            echo "should_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Add module indicator comment
        if: steps.check.outputs.should_update == 'true'
        run: |
          # Add a timestamped comment to track auto-updates
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          MODULE_NUM=${{ steps.count.outputs.current_count }}

          # This is a placeholder - in real implementation, you would:
          # 1. Have a queue of pre-written library mappings
          # 2. Add one from the queue to crate_map.rs
          # 3. For this demo, we just add a comment marker

          echo "// Auto-update: $TIMESTAMP - Total modules: $MODULE_NUM" >> py2rs/CHANGELOG.md

      - name: Commit and push changes
        if: steps.check.outputs.should_update == 'true'
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            MODULE_NUM=${{ steps.count.outputs.current_count }}
            git commit -m "chore: auto-add library mapping #$MODULE_NUM

Automated update via GitHub Actions
Triggered every 3 days to gradually expand library coverage"
            git push origin main
          fi

      - name: Create progress issue (monthly)
        if: steps.check.outputs.should_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create monthly progress report (only on 1st, 4th, 7th... updates)
          DAY_OF_MONTH=$(date +%d)
          if [ "$((10#$DAY_OF_MONTH % 9))" -eq 0 ]; then
            MODULE_COUNT=${{ steps.count.outputs.current_count }}
            gh issue create \
              --title "📊 Library Coverage Progress: $MODULE_COUNT+ modules" \
              --body "**Current library mappings:** $MODULE_COUNT+

**Progress toward 1000+ goal:** $(($MODULE_COUNT * 100 / 1000))%

This issue is auto-generated to track the gradual expansion of py2rs library coverage. New modules are added automatically every 3 days.

**Recent additions:** Check recent commits for details." \
              --label "enhancement,auto-generated" || echo "Issue creation skipped (may already exist)"
          fi
